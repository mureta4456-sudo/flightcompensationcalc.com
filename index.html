      <h1>Flight Compensation Calculator - EC 261/2004 Rights</h1>
      
      <h2>Are You Entitled to Flight Compensation?</h2>
      <p>Under EU Regulation 261/2004 and UK Regulation 261, you may be entitled to compensation if your flight was delayed by 3+ hours, cancelled with less than 14 days notice, or you were denied boarding due to overbooking.</p>

      <h3>Compensation Amounts (EC 261/2004)</h3>

        </tr>
        <tr>
          <td>1,500 - 3,500 km</td>
          <td>€400</td>
        </tr>
        <tr>
          <td>Over 3,500 km</td>
          <td>€600</td>
        </tr>
        <tr>
          <td>Inter-EU flights over 1,500 km</td>
          <td>€400 (or 50% if re-routing under certain conditions)</td>
        </tr>
      </table>

      <h3>How to Claim Your Compensation</h3>
      <ol>
        <li><strong>Check your eligibility:</strong> Verify your flight details and disruption type.</li>
        <li><strong>Gather your documents:</strong> Boarding pass, booking confirmation, and proof of delay.</li>
        <li><strong>Contact the airline:</strong> Use their official complaint form or customer service.</li>
        <li><strong>Escalate if needed:</strong> File with the National Enforcement Body or use Alternative Dispute Resolution.</li>
      </ol>

      <h3>Frequently Asked Questions</h3>
      <h4>Do I need to know my flight number?</h4>
      <p>Yes, you will need your booking reference and flight number provided by the airline.</p>

      <h4>How long do I have to claim?</h4>
      <p>In most EU countries, you have up to 3 years from the date of the flight. In the UK and Ireland, the limit is 6 years.</p>

      <h4>Does receiving food and accommodation affect my claim?</h4>
      <p>No. Receiving "Duty of Care" (meals, drinks, accommodation) does not waive your right to financial compensation under EC 261/2004.</p>

      <h4>Can I claim for connecting flights?</h4>
      <p>Yes, if your final destination was reached 3 or more hours later than the scheduled arrival time due to a missed connection.</p>

      <h4>Are delays caused by strikes covered?</h4>
      <p>Strikes by airline staff are generally considered "extraordinary circumstances" and may not entitle you to compensation, but you may still receive care (meals, accommodation).</p>
